apiVersion: v2
name: nginx
description: A Helm chart that deploys NGINX on Kubernetes

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# Chart version. Kept in lockstep with appVersion (the nginx image tag) so the
# chart version always tracks the image version it deploys.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 1.27.3

# This is the version number of the application being deployed — the nginx image
# tag. The Deployment uses this as the image tag when image.tag is left empty,
# so it must be a concrete numeric nginx version (never "latest").
# It is recommended to use it with quotes.
appVersion: "1.27.3"

keywords:
  - nginx
  - web
  - http
  - proxy
home: https://nginx.org
sources:
  - https://github.com/nginx/nginx
  - https://hub.docker.com/_/nginx
maintainers:
  - name: ucabvas
