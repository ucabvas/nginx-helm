    <h1>nginx-helm Helm chart repository</h1>
    <p>This branch hosts the published Helm charts for the nginx-helm project.</p>
    <p>Add the repository with:</p>
    <pre>helm repo add nginx-helm https://ucabvas.github.io/nginx-helm
helm repo update
helm install my-nginx nginx-helm/nginx</pre>
    <p>The chart index is available at
      <a href="index.yaml">index.yaml</a>.</p>
  </body>
